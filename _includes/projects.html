{% if include.show_heading != false %}
<h2 id="projects">Projects</h2>
{% endif %}

<div class="projects-list">
{% for project in site.data.projects %}
  <article class="project-item">
    <h3>{% if project.link %}<a href="{{ project.link }}" target="_blank" rel="noopener">{{ project.title }}</a>{% else %}{{ project.title }}{% endif %}</h3>
    {% if project.image %}
    <img class="project-image" src="{{ project.image | relative_url }}" alt="">
    {% endif %}
    <p>{{ project.summary }}</p>
  </article>
{% endfor %}
</div>
