<h2 id="honors">Selected honors</h2>
<ul class="plain-list honors-list">
{% for item in site.data.honors %}
  <li>
    <strong>{{ item.title }}</strong>{% if item.year %}, {{ item.year }}{% endif %}{% if item.org %}, {{ item.org }}{% endif %}
    {% if item.link %} <a href="{{ item.link }}" target="_blank" rel="noopener">[link]</a>{% endif %}
  </li>
{% endfor %}
</ul>
